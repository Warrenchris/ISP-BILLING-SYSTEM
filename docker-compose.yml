# version: '3.8' (Obsolete in newer Docker Compose)

services:
  backend:
    build:
      context: ./isp-billing-system-BACKEND
    container_name: isp-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=isp_billing_db
      - JWT_SECRET=isp_billing_secure_secret_key_2025
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://ai-service:5001
      # M-Pesa (Daraja): from project-root .env — same pattern as GROQ_API_KEY on ai-service
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-}
      - MPESA_BUSINESS_SHORT_CODE=${MPESA_BUSINESS_SHORT_CODE:-}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_PASS_KEY=${MPESA_PASS_KEY:-}
      - MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL:-}
      - MPESA_ENV=${MPESA_ENV:-sandbox}
      - MPESA_CALLBACK_TOKEN=${MPESA_CALLBACK_TOKEN:-}
      # Phase 1: Router provisioning
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MOCK_MIKROTIK=${MOCK_MIKROTIK:-false}
      - ROUTER_ENCRYPTION_KEY=${ROUTER_ENCRYPTION_KEY:-}
      - EXPIRY_CHECK_CRON=${EXPIRY_CHECK_CRON:-*/10 * * * *}
      - RECONCILIATION_CRON=${RECONCILIATION_CRON:-*/30 * * * *}
      - DEFAULT_GRACE_PERIOD_HOURS=${DEFAULT_GRACE_PERIOD_HOURS:-24}
      - PROVISIONING_MAX_RETRIES=${PROVISIONING_MAX_RETRIES:-10}
      - CIRCUIT_BREAKER_REQUEUE_DELAY_MS=${CIRCUIT_BREAKER_REQUEUE_DELAY_MS:-60000}
      # Phase 2: RADIUS & Voucher Management
      - RADIUS_SHARED_SECRET=${RADIUS_SHARED_SECRET:-}
      - RADIUS_DEFAULT_AUTH_TYPE=${RADIUS_DEFAULT_AUTH_TYPE:-Cleartext-Password}
      - RADIUS_DB_PASSWORD=${RADIUS_DB_PASSWORD:-}
      - ACCOUNTING_CHECK_CRON=${ACCOUNTING_CHECK_CRON:-*/5 * * * *}
      - VOUCHER_CODE_LENGTH=${VOUCHER_CODE_LENGTH:-8}
      - VOUCHER_BRUTE_FORCE_LIMIT=${VOUCHER_BRUTE_FORCE_LIMIT:-5}
      - VOUCHER_DEFAULT_EXPIRY_DAYS=${VOUCHER_DEFAULT_EXPIRY_DAYS:-365}
      # Phase 3: Smart Dunning & SMS Automation
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - AT_USERNAME=${AT_USERNAME:-sandbox}
      - AT_API_KEY=${AT_API_KEY:-}
      - AT_SENDER_ID=${AT_SENDER_ID:-}
      - DUNNING_CHECK_CRON=${DUNNING_CHECK_CRON:-0 * * * *}
      - SMS_DUNNING_WINDOW_HOURS=${SMS_DUNNING_WINDOW_HOURS:-24}
      - DEFAULT_COUNTRY_CODE=${DEFAULT_COUNTRY_CODE:-254}
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./isp-billing-system-BACKEND:/app
      - /app/node_modules
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - isp-network

  ai-service:
    build: ./ai-service
    container_name: isp-ai-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=isp_billing_db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama3-8b-8192}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ai_model_data:/app/data
    restart: unless-stopped
    networks:
      - isp-network

  frontend:
    build:
      context: ./isp-billing-frontend
      dockerfile: Dockerfile.dev
    container_name: isp-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./isp-billing-frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=/api
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - isp-network

  db:
    image: mysql:8.0
    container_name: isp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: isp_billing_db
    ports:
      # Expose database port for local integration tests on host machine (do NOT expose in production environment)
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=rootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - isp-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: isp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - isp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  freeradius:
    build: ./docker/freeradius
    container_name: isp-freeradius
    ports:
      - "1812:1812/udp" # Authentication
      - "1813:1813/udp" # Accounting
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${RADIUS_DB_USER:-radius_user}
      - DB_PASSWORD=${RADIUS_DB_PASSWORD:-radiuspassword}
      - DB_NAME=isp_billing_db
      - RADIUS_SHARED_SECRET=${RADIUS_SHARED_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - isp-network
    restart: unless-stopped

networks:
  isp-network:
    driver: bridge

volumes:
  mysql_data:
  ai_model_data:
  redis_data:

